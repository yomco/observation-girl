<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#202321" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="01 自室" />
<title>01 自室 — v0.9</title>
<style>
:root{--bg:#202321;--text:#f0f1ed;--muted:#afb5b0;--glass:rgba(24,27,26,.86)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d0f0e;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{display:flex;justify-content:center;overflow:hidden}.app{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:#252927}
.scene{position:absolute;inset:0;background:url('room-morning.png') center/cover no-repeat;transition:background-image 1.2s ease,filter 1.2s ease,opacity 1.2s ease}.scene.evening{filter:brightness(.58) saturate(.78)}.scene.night{filter:brightness(.31) saturate(.67)}
.awayveil{position:absolute;z-index:2;inset:0;opacity:0;pointer-events:none;transition:opacity 1.4s;background:linear-gradient(180deg,rgba(36,40,38,.96),rgba(28,31,29,.975));backdrop-filter:blur(9px)}.awayveil.show{opacity:0}.awayghost{position:absolute;inset:13% 8% 16%;border:1px solid rgba(255,255,255,.035);box-shadow:inset 0 0 100px rgba(0,0,0,.14)}
.topmask{position:absolute;z-index:3;left:0;right:0;top:0;height:175px;background:linear-gradient(rgba(31,34,32,.95),rgba(31,34,32,.58) 56%,transparent);pointer-events:none}.header{position:absolute;z-index:5;top:max(23px,env(safe-area-inset-top));left:24px;right:24px}.place{font-size:17px;letter-spacing:.1em}.place .num{margin-right:16px;font-variant-numeric:tabular-nums}.clock{font-weight:300;font-size:48px;letter-spacing:.025em;line-height:1;margin-top:17px;font-variant-numeric:tabular-nums}.date{font-size:13px;color:var(--muted);margin-top:9px;letter-spacing:.05em}.daymark{font-size:10px;color:#8d938e;margin-top:5px;letter-spacing:.12em;opacity:.75}
.props{position:absolute;z-index:4;inset:0;pointer-events:none}.prop{position:absolute;opacity:0;transition:opacity .9s,transform .9s}.prop.show{opacity:.92;transform:translateY(0)}
.memo{left:18%;top:61%;width:13%;aspect-ratio:1.45;background:#d6d0bc;border:1px solid rgba(49,45,39,.38);box-shadow:0 3px 10px rgba(0,0,0,.22);transform:translateY(4px) rotate(-4deg)}.memo:after{content:"♪  4/4\A  ♩ = 92";white-space:pre;position:absolute;inset:17% 10%;font-family:"Yu Mincho",serif;font-size:8px;color:#504d45;line-height:1.4}.screenGlow{left:8%;top:50%;width:20%;height:8%;border-radius:8px;background:radial-gradient(ellipse at 30% 60%,rgba(144,167,169,.23),transparent 67%);filter:blur(5px);mix-blend-mode:screen}.paper{left:31%;top:55.5%;width:9%;aspect-ratio:.74;background:rgba(232,226,209,.86);border:1px solid rgba(60,55,48,.32);box-shadow:0 2px 8px rgba(0,0,0,.18);transform:rotate(3deg)}.paper:after{content:"8/2\A・・・\A・・・";white-space:pre;position:absolute;inset:16%;font-family:"Yu Mincho",serif;color:#686159;font-size:7px;line-height:1.5}.cup{left:23%;top:58%;width:4.8%;aspect-ratio:.9;border:1px solid rgba(225,225,215,.35);border-radius:2px 2px 5px 5px;background:rgba(86,88,82,.72);transform:rotate(-2deg)}.stick{right:12%;top:60%;width:13%;height:2px;background:rgba(196,180,148,.7);box-shadow:0 5px 0 rgba(196,180,148,.62);transform:rotate(-11deg)}
.score{right:18%;top:56%;width:11%;height:7%;background:rgba(232,229,219,.82);border:1px solid rgba(50,50,46,.28);transform:rotate(5deg)}.score:after{content:"𝄞  ♩  ♪\A━━ ━━ ━━";white-space:pre;position:absolute;inset:12%;font-size:7px;line-height:1.4;color:#5c5b56}.umbrella{right:6.5%;bottom:21%;width:2px;height:18%;background:#8f918d;transform:rotate(4deg)}.umbrella:after{content:"";position:absolute;top:-6px;left:-6px;width:12px;height:6px;border:1px solid #8f918d;border-bottom:0;border-radius:12px 12px 0 0}.wrapper{left:27%;top:63%;width:5%;height:2.5%;background:rgba(190,178,151,.7);transform:rotate(8deg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.bottommask{position:absolute;z-index:3;left:0;right:0;bottom:0;height:170px;background:linear-gradient(transparent,rgba(25,28,27,.74) 45%,#1b1e1d 100%);pointer-events:none}.hint{position:absolute;z-index:5;left:24px;right:24px;bottom:calc(91px + env(safe-area-inset-bottom));font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;line-height:1.7;color:#e8e9e5;text-shadow:0 2px 14px #000;min-height:26px;opacity:.92}
.nav{position:absolute;z-index:6;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(24,27,26,.96);border-top:1px solid rgba(255,255,255,.07)}button{font:inherit;color:inherit}.nav button{background:0;border:0;color:#aab0ab;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:6px}.nav button.active{color:#fff}.ico{font-size:22px}.lab{font-size:12px}
.sheet{position:absolute;z-index:20;inset:0;background:rgba(0,0,0,.36);display:none;align-items:flex-end}.sheet.open{display:flex}.card{width:100%;max-height:72dvh;overflow:auto;background:#252927;border-radius:19px 19px 0 0;padding:18px 20px calc(28px + env(safe-area-inset-bottom))}.handle{width:42px;height:4px;background:#666d68;border-radius:20px;margin:0 auto 18px}.close{float:right;border:0;background:none;color:#bcc1bd;padding:4px}.title{font-size:20px;margin:5px 0 17px}.caption{font-size:12px;color:#929893;line-height:1.8;margin-top:15px}.diary{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2.05;background:#343735;padding:20px;border-radius:7px;color:#e5e5df}.diary .d{color:#b6bab5;font-size:12px;margin-bottom:8px}.log{padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.65}.log:first-of-type{border-top:0}.log time{font-variant-numeric:tabular-nums;color:#c7cbc7;margin-right:10px}.empty{color:#929893;line-height:1.9;font-size:14px}.settings button{width:100%;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:#323633;text-align:left;padding:13px 14px;margin:5px 0}.tiny{font-size:12px;color:#8f948f;margin-top:9px;line-height:1.7}.streak{font-size:12px;color:#a8aea9;border-top:1px solid rgba(255,255,255,.08);padding-top:13px;margin-top:16px}
@media(min-width:521px){body{padding:18px 0}.app{height:calc(100dvh - 36px);border-radius:22px;box-shadow:0 20px 70px #000}}
</style></head>
<body><main class="app">
<div id="scene" class="scene"></div><div id="awayveil" class="awayveil"><div class="awayghost"></div></div>
<div class="props"><div id="memo" class="prop memo"></div><div id="glow" class="prop screenGlow"></div><div id="paper" class="prop paper"></div><div id="cup" class="prop cup"></div><div id="stick" class="prop stick"></div><div id="score" class="prop score"></div><div id="umbrella" class="prop umbrella"></div><div id="wrapper" class="prop wrapper"></div></div>
<div class="topmask"></div><header class="header"><div class="place"><span class="num">01</span>自室</div><div id="clock" class="clock">07:12</div><div id="date" class="date"></div><div id="daymark" class="daymark"></div></header>
<div class="bottommask"></div><div id="hint" class="hint"></div>
<nav class="nav"><button class="active" data-sheet="none"><span class="ico">◌</span><span class="lab">部屋</span></button><button data-sheet="diary"><span class="ico">□</span><span class="lab">日記</span></button><button data-sheet="trace"><span class="ico">≡</span><span class="lab">痕跡</span></button><button data-sheet="settings"><span class="ico">⚙︎</span><span class="lab">設定</span></button></nav>
<div id="sheet" class="sheet"><div class="card"><div class="handle"></div><button class="close" id="close">閉じる</button><div id="sheetBody"></div></div></div>
</main>
<script>
const $=s=>document.querySelector(s);let demo=null,current=null,lastVisibleKey='';
function hashDate(d){let h=2166136261;for(const c of `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h>>>0)}
function rnd(h,n){return ((Math.abs(Math.sin((h+n*92821)*.0000017))*10000)%1)}
function innerState(d){const h=hashDate(d),pd=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1),p=hashDate(pd);const yesterday={tired:rnd(p,1),creative:rnd(p,3),reflect:rnd(p,4),club:rnd(p,6),unease:rnd(p,7)};return{tired:rnd(h,1)*.62+yesterday.tired*.38,energy:rnd(h,2)*.7+(1-yesterday.tired)*.3,creative:rnd(h,3)*.58+yesterday.creative*.42,reflect:rnd(h,4)*.64+yesterday.reflect*.36,social:rnd(h,5),club:rnd(h,6)*.68+yesterday.club*.32,unease:rnd(h,7)*.62+yesterday.unease*.38}}
function eventOf(d,i){const h=hashDate(d),r=rnd(h,11);if(r<.08)return'stayhome';if(r<.16)return'early';if(r<.24)return'late';if(r<.31)return'rain';if(i.creative>.8&&rnd(h,12)>.45)return'idea';return'normal'}
function plan(d){const h=hashDate(d),weekend=[0,6].includes(d.getDay()),i=innerState(d),event=eventOf(d,i);let wake=weekend?7.25+(h%38)/100:6.67+(h%23)/100;wake+=i.tired*.20-i.energy*.08;let leave=weekend?(h%3===0?10.25:8.12):8.00+(h%13)/100;leave+=i.tired*.06;let ret=weekend?16.7+(h%145)/100:18.35+(h%112)/100;ret+=i.club*.55-i.social*.22;if(event==='stayhome')leave=24.5;if(event==='early')ret-=2.1;if(event==='late')ret+=2.0;return{seed:h,inner:i,event,wake,leave,ret,compose:(h%3!==1||i.creative>.63)&&i.tired<.9,diary:h%4!==0||i.reflect>.72}}
function now(){if(!demo)return new Date();const d=new Date();d.setHours(demo.h,demo.m,0,0);return d}
function dateText(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]})`}
function state(d){const p=plan(d),i=p.inner,t=d.getHours()+d.getMinutes()/60;if(t<p.wake)return{id:'sleep',home:true,light:t<5.5?'night':'',hint:t>6.5?(i.tired>.72?'まだ起きる気配がない。':'まだ静かだ。'):''};if(t<p.wake+.25)return{id:'wake',home:true,light:'',hint:i.energy>.72?'カーテンが開いている。':'カーテンが少し動いている。'};if(t<p.leave)return{id:'prep',home:true,light:'',hint:p.event==='stayhome'&&t>9?'今日はまだ出る気配がない。':'',cup:i.energy<.35,stick:i.club>.7,score:i.club>.62,umbrella:p.event==='rain'};if(t<p.ret)return{id:'away',home:false,light:t>18?'evening':'',hint:'',umbrella:false};if(t<21.55)return{id:'back',home:true,light:'evening',hint:i.tired>.78?'明かりだけついている。':'',memo:i.creative>.52,cup:i.tired>.48,stick:i.club>.62,paper:i.reflect>.86,score:i.club>.56,umbrella:p.event==='rain',wrapper:i.tired>.66||p.event==='late'};if(t<23.15&&p.compose)return{id:'compose',home:true,light:'night',hint:i.creative>.82?'同じ短いフレーズが、何度か繰り返されている。':'',memo:true,glow:true,cup:i.tired>.35,stick:i.club>.55,paper:p.diary&&t>22.2,score:true,wrapper:p.event==='late'};if(t<23.72)return{id:'late',home:true,light:'night',hint:'',paper:p.diary,cup:i.tired>.55,memo:i.creative>.7,score:i.club>.7};return{id:'sleep2',home:true,light:'night',hint:'',paper:p.diary&&i.reflect>.45}}
function traceKey(d,s){return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}:${s.id}:${['memo','glow','paper','cup','stick','score','umbrella','wrapper'].filter(x=>s[x]).join('')}`}
function storeTrace(d,s){if(demo||!s.home)return;const k=traceKey(d,s);if(k===lastVisibleKey)return;lastVisibleKey=k;const texts=[];if(s.memo)texts.push('机に小さなメモが増えていた。');if(s.score)texts.push('楽譜が開いたままだった。');if(s.paper)texts.push('紙が一枚、机に残っていた。');if(s.stick)texts.push('スティックが出したままになっていた。');if(s.cup)texts.push('飲みかけのカップが残っていた。');if(s.umbrella)texts.push('傘が部屋に戻っていた。');if(s.wrapper)texts.push('机の端に小さな包み紙があった。');if(!texts.length)return;let arr=[];try{arr=JSON.parse(localStorage.getItem('og_v09_trace')||'[]')}catch{};if(arr.some(x=>x.k===k))return;arr.push({k,time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,text:texts.slice(0,2).join(' '),date:`${d.getMonth()+1}/${d.getDate()}`});localStorage.setItem('og_v09_trace',JSON.stringify(arr.slice(-40)));localStorage.setItem('og_v09_lastvisit',d.toISOString())}
function render(){const d=now(),s=state(d);current=s;$('#clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;$('#date').textContent=dateText(d);let img='room-morning.png'; if(!s.home) img='room-away.png'; else if(s.id==='compose'||s.id==='late'||s.id==='sleep2') img='room-compose.png'; else if(s.id==='back') img='room-return.png'; $('#scene').style.backgroundImage=`url('${img}')`; $('#scene').className='scene '+(s.light||'');$('#awayveil').classList.toggle('show',!s.home);$('#hint').textContent=s.hint||'';for(const id of['memo','glow','paper','cup','stick','score','umbrella','wrapper'])$('#'+id).classList.toggle('show',!!(s.home&&s[id]));$('#daymark').textContent=`DAY ${String((hashDate(d)%97)+1).padStart(2,'0')}`;storeTrace(d,s)}
setInterval(render,30000);render();
function diaryHTML(){const d=now(),p=plan(d),t=d.getHours()+d.getMinutes()/60;if(!(current&&current.home&&p.diary&&t>22.15&&current.paper))return `<div class="title">日記</div><div class="empty">今は、ここにはない。</div>`;const i=p.inner,prev=innerState(new Date(d.getFullYear(),d.getMonth(),d.getDate()-1));let a;if(p.event==='rain')a=`雨の音で、帰り道のリズムがずっと残っていた。<br>傘を閉じる音も悪くない。<br><br>忘れる前に少しだけ打ち込んだ。`;else if(p.event==='early')a=`思ったより早く帰れた。<br>何もしないつもりだったのに、結局アプリを開いた。<br><br>昨日の続きがまだ気になっている。`;else if(p.event==='late')a=`帰るのが遅くなった。<br>今日はもう作らないつもりだった。<br><br>でも四小節だけ。`;else if(i.tired>.78)a=`眠い。今日はもうだめ。<br>でも、帰ってから一回だけあの部分を聴いた。<br><br>${prev.tired>.7?'昨日からずっと重い。':'明日の自分に任せる。'}`;else if(i.creative>.74)a=`帰り道で四小節だけ浮かんだ。<br>忘れそうだったから、スマホに打ち込んだ。<br><br>${prev.creative>.72?'昨日の続きみたいな音だった。':'家で聴いたら少し違った。でも嫌いじゃない。'}`;else if(i.club>.72)a=`今日の合奏、最後の入りだけ気持ちよかった。<br>あの一瞬を曲に入れられないかな。<br><br>スティックの重さまで覚えていたい。`;else if(i.unease>.7)a=`今日は少し変な日だった。<br>理由はうまく書けない。<br><br>音を小さくして、しばらく何もしなかった。`;else a=`リズムを細かくしすぎた。<br>削った方がたぶんいい。<br><br>でも、変な一音だけ残したい。`;return `<div class="title">日記</div><div class="diary"><div class="d">${d.getMonth()+1}月${d.getDate()}日</div>${a}</div><div class="caption">読めるのは、残されていたページだけ。</div>`}
function traceHTML(){let arr=[];try{arr=JSON.parse(localStorage.getItem('og_v09_trace')||'[]')}catch{};const rows=arr.slice().reverse().map(x=>`<div class="log"><time>${x.date} ${x.time}</time>${x.text}</div>`).join('');let streak='';if(arr.length){const days=[...new Set(arr.map(x=>x.date))].length;streak=`<div class="streak">痕跡が残っている日：${days}日</div>`}return `<div class="title">痕跡</div>${rows||'<div class="empty">まだ何も気づいていない。</div>'}${streak}<div class="caption">見ていなかった時間は、空白のまま。昨日の何かが、今日に残ることもある。</div>`}
const settingsHTML=`<div class="title">設定 / デモ</div><div class="settings"><button data-time="live">現在時刻に戻す</button><button data-time="7:12">07:12</button><button data-time="8:30">08:30</button><button data-time="16:30">16:30</button><button data-time="19:40">19:40</button><button data-time="22:25">22:25</button><button data-time="23:40">23:40</button></div><div class="tiny">v0.9：朝・不在・帰宅後・作曲中で、同じ定点の部屋画像が切り替わります。昨日の疲れや創作の流れも少しだけ翌日に残ります。まれに早帰り・遅帰り・在宅・雨の日があります。理由は表示されません。デモ時刻では痕跡は保存されません。</div>`;
function openSheet(type){if(type==='none')return;$('#sheetBody').innerHTML=type==='diary'?diaryHTML():type==='trace'?traceHTML():settingsHTML;$('#sheet').classList.add('open');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{if(b.dataset.time==='live')demo=null;else{const[h,m]=b.dataset.time.split(':').map(Number);demo={h,m}}render();$('#sheet').classList.remove('open')})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));$('#close').onclick=()=>$('#sheet').classList.remove('open');$('#sheet').onclick=e=>{if(e.target===$('#sheet'))$('#sheet').classList.remove('open')};
</script></body></html>
