<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>観測記録 — prototype</title>
<style>
:root{--ink:#e9e7df;--dim:#aaa99f;--glass:rgba(22,24,22,.62)}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#20231f;color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{overflow:hidden}.scene{position:fixed;inset:0;background:#20231f}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
transition:opacity 1.8s ease;filter:saturate(.82) contrast(.96)}
.frame.on{opacity:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 25%,transparent 70%,rgba(0,0,0,.42))}
.top{position:absolute;top:max(20px,env(safe-area-inset-top));left:24px;right:24px;display:flex;
justify-content:space-between;align-items:flex-start;text-shadow:0 1px 5px #000}
.place{font-size:13px;letter-spacing:.18em}.clock{font:300 36px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.status{margin-top:8px;font-size:12px;color:#d8d7cf}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;
background:#d8d7cf;margin-right:8px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.bottom{position:absolute;left:24px;right:24px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:end}
.card{background:var(--glass);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.info{font-size:12px;line-height:1.7;max-width:520px}.label{color:var(--dim);margin-right:8px}
.controls{margin-left:auto;display:flex;gap:8px}
button{border:1px solid rgba(255,255,255,.25);background:rgba(20,22,20,.68);color:var(--ink);
border-radius:10px;padding:10px 13px;font-size:12px;cursor:pointer}
button:hover{background:rgba(45,48,43,.8)}
.off{position:absolute;inset:0;display:none;place-items:center;background:#252824;text-align:center}
.off.show{display:grid}.off strong{font-size:18px;font-weight:500;letter-spacing:.12em}.off small{display:block;color:#aaa99f;margin-top:12px}
.hint{position:absolute;right:24px;top:82px;font-size:11px;color:rgba(255,255,255,.58)}
@media(max-width:650px){.clock{font-size:30px}.bottom{display:block}.controls{margin-top:8px}.card{max-width:none}.frame{object-position:center}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <img class="frame" src="0712.jpg"><img class="frame" src="0726.jpg"><img class="frame" src="0734.jpg">
  <img class="frame" src="0748.jpg"><img class="frame" src="0756.jpg"><img class="frame" src="0802.jpg">
  <div class="shade"></div>
  <div class="off" id="off"><div><strong>観測範囲外</strong><small>現在地：通学中</small></div></div>
  <div class="top"><div><div class="place">自室 / FIXED POINT 01</div><div class="status"><span class="dot"></span>観測中</div></div><div class="clock" id="clock">07:12</div></div>
  <div class="hint">操作しても彼女の行動は変わりません</div>
  <div class="bottom">
    <div class="card info"><span class="label">観測記録</span><span id="note">まだ眠っている。</span></div>
    <div class="controls"><button id="prev">← 戻る</button><button id="play">一時停止</button><button id="next">進む →</button></div>
  </div>
</div>
<script>
const states=[
 {t:"07:12",note:"まだ眠っている。"},
 {t:"07:26",note:"スマートフォンを見ている。"},
 {t:"07:34",note:"ようやく起き上がった。"},
 {t:"07:48",note:"制服に着替えている。"},
 {t:"07:56",note:"横長の黒い通学鞄を持った。"},
 {t:"08:02",note:"部屋を出た。"},
 {t:"08:03",note:"この場所からは観測できない。",off:true}
];
const frames=[...document.querySelectorAll(".frame")], clock=document.querySelector("#clock"),
note=document.querySelector("#note"), off=document.querySelector("#off"), play=document.querySelector("#play");
let i=0, playing=true, timer;
function show(n){
 i=(n+states.length)%states.length; const s=states[i];
 frames.forEach((f,k)=>f.classList.toggle("on",!s.off && k===Math.min(i,5)));
 off.classList.toggle("show",!!s.off); clock.textContent=s.t; note.textContent=s.note;
}
function schedule(){clearInterval(timer); if(playing) timer=setInterval(()=>show(i+1),4500)}
document.querySelector("#next").onclick=()=>{show(i+1);schedule()}
document.querySelector("#prev").onclick=()=>{show(i-1);schedule()}
play.onclick=()=>{playing=!playing;play.textContent=playing?"一時停止":"再生";schedule()}
show(0); schedule();
</script>
</body>
</html>
