<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#202321" />
<title>01 自室</title>
<style>
:root{--bg:#202321;--text:#f0f1ed;--muted:#afb5b0;--glass:rgba(24,27,26,.86)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d0f0e;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{display:flex;justify-content:center;overflow:hidden}.app{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:#252927}
.scene{position:absolute;inset:0;background:url('room-0712.png') center/cover no-repeat;transition:filter 1.4s,opacity 1.4s}.scene.evening{filter:brightness(.58) saturate(.78)}.scene.night{filter:brightness(.31) saturate(.67)}
/* 不在時は説明を出さず、部屋の像だけが遠のく。人物を明確に見せないための薄い幕。 */
.awayveil{position:absolute;z-index:2;inset:0;opacity:0;pointer-events:none;transition:opacity 1.4s;background:linear-gradient(180deg,rgba(36,40,38,.96),rgba(28,31,29,.975));backdrop-filter:blur(9px)}.awayveil.show{opacity:1}.awayghost{position:absolute;inset:13% 8% 16%;border:1px solid rgba(255,255,255,.035);border-radius:2px;box-shadow:inset 0 0 100px rgba(0,0,0,.14)}
.topmask{position:absolute;z-index:3;left:0;right:0;top:0;height:175px;background:linear-gradient(rgba(31,34,32,.95),rgba(31,34,32,.58) 56%,transparent);pointer-events:none}.header{position:absolute;z-index:5;top:max(23px,env(safe-area-inset-top));left:24px;right:24px}.place{font-size:17px;letter-spacing:.1em}.place .num{margin-right:16px;font-variant-numeric:tabular-nums}.clock{font-weight:300;font-size:48px;letter-spacing:.025em;line-height:1;margin-top:17px;font-variant-numeric:tabular-nums}.date{font-size:13px;color:var(--muted);margin-top:9px;letter-spacing:.05em}
/* 画像上に直接現れる、説明しすぎない小さな痕跡 */
.props{position:absolute;z-index:4;inset:0;pointer-events:none}.prop{position:absolute;opacity:0;transition:opacity .9s,transform .9s}.prop.show{opacity:.92;transform:translateY(0)}
.memo{left:18%;top:61%;width:13%;aspect-ratio:1.45;background:#d6d0bc;border:1px solid rgba(49,45,39,.38);box-shadow:0 3px 10px rgba(0,0,0,.22);transform:translateY(4px) rotate(-4deg)}.memo:after{content:"♪  4/4\A  ♩ = 92";white-space:pre;position:absolute;inset:17% 10%;font-family:"Yu Mincho",serif;font-size:8px;color:#504d45;line-height:1.4}.screenGlow{left:8%;top:50%;width:20%;height:8%;border-radius:8px;background:radial-gradient(ellipse at 30% 60%,rgba(144,167,169,.23),transparent 67%);filter:blur(5px);mix-blend-mode:screen}.paper{left:31%;top:55.5%;width:9%;aspect-ratio:.74;background:rgba(232,226,209,.86);border:1px solid rgba(60,55,48,.32);box-shadow:0 2px 8px rgba(0,0,0,.18);transform:rotate(3deg)}.paper:after{content:"8/2\A・・・\A・・・";white-space:pre;position:absolute;inset:16%;font-family:"Yu Mincho",serif;color:#686159;font-size:7px;line-height:1.5}
.bottommask{position:absolute;z-index:3;left:0;right:0;bottom:0;height:170px;background:linear-gradient(transparent,rgba(25,28,27,.74) 45%,#1b1e1d 100%);pointer-events:none}.hint{position:absolute;z-index:5;left:24px;right:24px;bottom:calc(91px + env(safe-area-inset-bottom));font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;line-height:1.7;color:#e8e9e5;text-shadow:0 2px 14px #000;min-height:26px;opacity:.92}
.nav{position:absolute;z-index:6;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(24,27,26,.96);border-top:1px solid rgba(255,255,255,.07)}button{font:inherit;color:inherit}.nav button{background:0;border:0;color:#aab0ab;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:6px}.nav button.active{color:#fff}.ico{font-size:22px}.lab{font-size:12px}
.sheet{position:absolute;z-index:20;inset:0;background:rgba(0,0,0,.36);display:none;align-items:flex-end}.sheet.open{display:flex}.card{width:100%;max-height:72dvh;overflow:auto;background:#252927;border-radius:19px 19px 0 0;padding:18px 20px calc(28px + env(safe-area-inset-bottom))}.handle{width:42px;height:4px;background:#666d68;border-radius:20px;margin:0 auto 18px}.close{float:right;border:0;background:none;color:#bcc1bd;padding:4px}.title{font-size:20px;margin:5px 0 17px}.caption{font-size:12px;color:#929893;line-height:1.8;margin-top:15px}.diary{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2.05;background:#343735;padding:20px;border-radius:7px;color:#e5e5df}.diary .d{color:#b6bab5;font-size:12px;margin-bottom:8px}.log{padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.65}.log:first-of-type{border-top:0}.log time{font-variant-numeric:tabular-nums;color:#c7cbc7;margin-right:10px}.empty{color:#929893;line-height:1.9;font-size:14px}.settings button{width:100%;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:#323633;text-align:left;padding:13px 14px;margin:5px 0}.tiny{font-size:12px;color:#8f948f;margin-top:9px;line-height:1.7}
@media(min-width:521px){body{padding:18px 0}.app{height:calc(100dvh - 36px);border-radius:22px;box-shadow:0 20px 70px #000}}
</style></head>
<body><main class="app">
<div id="scene" class="scene"></div><div id="awayveil" class="awayveil"><div class="awayghost"></div></div>
<div class="props"><div id="memo" class="prop memo"></div><div id="glow" class="prop screenGlow"></div><div id="paper" class="prop paper"></div></div>
<div class="topmask"></div><header class="header"><div class="place"><span class="num">01</span>自室</div><div id="clock" class="clock">07:12</div><div id="date" class="date"></div></header>
<div class="bottommask"></div><div id="hint" class="hint"></div>
<nav class="nav"><button class="active" data-sheet="none"><span class="ico">◌</span><span class="lab">部屋</span></button><button data-sheet="diary"><span class="ico">□</span><span class="lab">日記</span></button><button data-sheet="trace"><span class="ico">≡</span><span class="lab">痕跡</span></button><button data-sheet="settings"><span class="ico">⚙︎</span><span class="lab">設定</span></button></nav>
<div id="sheet" class="sheet"><div class="card"><div class="handle"></div><button class="close" id="close">閉じる</button><div id="sheetBody"></div></div></div>
</main>
<script>
const $=s=>document.querySelector(s);let demo=null,current=null,lastVisibleKey='';
function hashDate(d){let h=2166136261;for(const c of `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h>>>0)}
function plan(d){const h=hashDate(d),weekend=[0,6].includes(d.getDay());return{seed:h,wake:weekend?7.25+(h%38)/100:6.67+(h%23)/100,leave:weekend?(h%3===0?10.25:8.12):8.00+(h%13)/100,ret:weekend?16.7+(h%145)/100:18.35+(h%112)/100,compose:h%3!==1,diary:h%4!==0,late:h%5===0}}
function now(){if(!demo)return new Date();const d=new Date();d.setHours(demo.h,demo.m,0,0);return d}
function dateText(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]})`}
function state(d){const p=plan(d),t=d.getHours()+d.getMinutes()/60;if(t<p.wake)return{id:'sleep',home:true,light:t<5.5?'night':'',hint:t>6.5?'まだ静かだ。':''};if(t<p.wake+.25)return{id:'wake',home:true,light:'',hint:'カーテンが少し動いている。'};if(t<p.leave)return{id:'prep',home:true,light:'',hint:''};if(t<p.ret+(p.late?.55:0))return{id:'away',home:false,light:t>18?'evening':'',hint:''};if(t<21.55)return{id:'back',home:true,light:'evening',hint:'',memo:p.seed%2===0};if(t<23.15&&p.compose)return{id:'compose',home:true,light:'night',hint:'',memo:true,glow:true,paper:p.diary&&t>22.2};if(t<23.72)return{id:'late',home:true,light:'night',hint:'',paper:p.diary};return{id:'sleep2',home:true,light:'night',hint:'',paper:p.diary&&p.seed%2===1}}
function traceKey(d,s){return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}:${s.id}:${s.memo?'m':''}${s.glow?'g':''}${s.paper?'p':''}`}
function storeTrace(d,s){if(demo||!s.home)return;const k=traceKey(d,s);if(k===lastVisibleKey)return;lastVisibleKey=k;let text='';if(s.memo)text='机に小さなメモが増えていた。';else if(s.glow)text='机の明かりがついていた。';else if(s.paper)text='紙が一枚、机に残っていた。';else return;let arr=[];try{arr=JSON.parse(localStorage.getItem('og_v05_trace')||'[]')}catch{};if(arr.some(x=>x.k===k))return;arr.push({k,time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,text,date:`${d.getMonth()+1}/${d.getDate()}`});localStorage.setItem('og_v05_trace',JSON.stringify(arr.slice(-30)))}
function render(){const d=now(),s=state(d);current=s;$('#clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;$('#date').textContent=dateText(d);$('#scene').className='scene '+(s.light||'');$('#awayveil').classList.toggle('show',!s.home);$('#hint').textContent=s.hint||'';$('#memo').classList.toggle('show',!!(s.home&&s.memo));$('#glow').classList.toggle('show',!!(s.home&&s.glow));$('#paper').classList.toggle('show',!!(s.home&&s.paper));storeTrace(d,s)}
setInterval(render,30000);render();
function diaryHTML(){const d=now(),p=plan(d),t=d.getHours()+d.getMinutes()/60;if(!(current&&current.home&&p.diary&&t>22.15&&current.paper))return `<div class="title">日記</div><div class="empty">今は、ここにはない。</div>`;const a=[`帰り道で四小節だけ浮かんだ。<br>忘れそうだったから、駅でスマホに打ち込んだ。<br><br>家で聴いたら少し違った。`,`今日の合奏、最後の入りだけ気持ちよかった。<br>あの感じを曲に入れられないかな。<br><br>明日また試す。`,`リズムを細かくしすぎた。<br>削った方がたぶんいい。<br><br>でも、変な一音だけ残したい。`,`今日は何も作らなかった。<br>音楽を聴くだけの日も必要だと思う。`];return `<div class="title">日記</div><div class="diary"><div class="d">${d.getMonth()+1}月${d.getDate()}日</div>${a[p.seed%a.length]}</div><div class="caption">書かなかったこともある。</div>`}
function traceHTML(){let arr=[];try{arr=JSON.parse(localStorage.getItem('og_v05_trace')||'[]')}catch{};const rows=arr.slice().reverse().map(x=>`<div class="log"><time>${x.date} ${x.time}</time>${x.text}</div>`).join('');return `<div class="title">痕跡</div>${rows||'<div class="empty">まだ何も気づいていない。</div>'}<div class="caption">ここに残るのは、見つけた変化だけ。</div>`}
const settingsHTML=`<div class="title">設定 / デモ</div><div class="settings"><button data-time="live">現在時刻に戻す</button><button data-time="7:12">07:12</button><button data-time="8:30">08:30</button><button data-time="19:40">19:40</button><button data-time="22:25">22:25</button><button data-time="23:40">23:40</button></div><div class="tiny">デモ時刻では痕跡は保存されません。毎日の時刻や行動は少しずつ変わります。</div>`;
function openSheet(type){if(type==='none')return;$('#sheetBody').innerHTML=type==='diary'?diaryHTML():type==='trace'?traceHTML():settingsHTML;$('#sheet').classList.add('open');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{if(b.dataset.time==='live')demo=null;else{const[h,m]=b.dataset.time.split(':').map(Number);demo={h,m}}render();$('#sheet').classList.remove('open')})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));$('#close').onclick=()=>$('#sheet').classList.remove('open');$('#sheet').onclick=e=>{if(e.target===$('#sheet'))$('#sheet').classList.remove('open')};
</script></body></html>
