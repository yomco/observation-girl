<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#202321" />
<title>01 自室</title>
<style>
:root{--bg:#202321;--panel:rgba(25,28,27,.80);--line:rgba(255,255,255,.28);--text:#f1f2ef;--muted:#b9beb9}
*{box-sizing:border-box}html,body{margin:0;background:#111;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;height:100%}
body{display:flex;justify-content:center;overflow:hidden}.app{position:relative;width:min(100vw,520px);height:100dvh;background:#252a28;overflow:hidden}
.scene{position:absolute;inset:0;background:url('room-0712.png') center/cover no-repeat;transition:filter .8s,opacity .8s,transform .8s}.scene.evening{filter:brightness(.54) saturate(.78)}.scene.night{filter:brightness(.28) saturate(.62)}
.awayveil{position:absolute;inset:0;z-index:1;display:none;background:linear-gradient(180deg,#303430 0%,#252925 46%,#1b1e1c 100%)}.awayveil.show{display:block}.awayveil:before{content:"";position:absolute;left:12%;right:12%;bottom:17%;height:34%;border:1px solid rgba(255,255,255,.05);border-bottom:0;opacity:.6}.awayveil:after{content:"";position:absolute;left:18%;bottom:17%;width:31%;height:22%;border:1px solid rgba(255,255,255,.04);opacity:.7}
.topmask{position:absolute;z-index:2;left:0;right:0;top:0;height:185px;background:linear-gradient(#242725 0%,rgba(36,39,37,.96) 62%,rgba(36,39,37,0));pointer-events:none}.header{position:absolute;z-index:4;top:max(22px,env(safe-area-inset-top));left:22px;right:22px}.place{font-size:17px;letter-spacing:.08em}.place .num{font-variant-numeric:tabular-nums;margin-right:15px}.clock{font-size:48px;line-height:1.05;margin-top:16px;font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums}.date{font-size:14px;margin-top:8px;color:var(--muted);letter-spacing:.04em}
.bottommask{position:absolute;z-index:2;left:0;right:0;bottom:0;height:210px;background:linear-gradient(rgba(28,31,30,0),rgba(28,31,30,.90) 42%,#1d201f 100%);pointer-events:none}.whisper{position:absolute;z-index:4;left:22px;right:22px;bottom:calc(92px + env(safe-area-inset-bottom));font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;line-height:1.7;color:#eceee9;text-shadow:0 1px 12px #000;min-height:28px}
.trace{display:inline-block;margin-top:8px;padding:5px 8px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font-size:11px;color:#c4c9c4;background:rgba(20,22,21,.32)}
.nav{position:absolute;z-index:5;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(25,28,27,.96);border-top:1px solid rgba(255,255,255,.08)}button{font:inherit;color:inherit}.nav button{background:none;border:0;color:#aeb3af;padding:10px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button.active{color:#fff}.ico{font-size:23px;line-height:1}.lab{font-size:12px}
.sheet{position:absolute;z-index:10;inset:0;background:rgba(0,0,0,.34);display:none;align-items:flex-end}.sheet.open{display:flex}.card{width:100%;background:#252927;border-radius:18px 18px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));max-height:70dvh;overflow:auto}.handle{width:44px;height:4px;background:#6b706c;border-radius:20px;margin:0 auto 20px}.title{font-size:20px;margin-bottom:16px}.close{float:right;background:none;border:0;color:#c8cbc8;font-size:15px}.caption{color:#aeb3af;font-size:13px;line-height:1.7;margin-top:12px}.diary{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2;color:#e4e5df;background:#343734;padding:20px;border-radius:6px}.diary .d{font-size:13px;color:#b8bbb6;margin-bottom:8px}.log{border-top:1px solid rgba(255,255,255,.09);padding:12px 0;font-size:14px;line-height:1.6}.log:first-of-type{border-top:0}.log time{color:#c7cbc7;font-variant-numeric:tabular-nums;margin-right:10px}.emptylog{color:#8f948f;font-size:14px;line-height:1.8}.settings button{width:100%;text-align:left;background:#323633;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:13px 14px;margin:5px 0}.tiny{font-size:12px;color:#8f948f;margin-top:8px}
@media(min-width:521px){body{padding:18px 0;background:#0b0c0c}.app{height:calc(100dvh - 36px);border-radius:22px;box-shadow:0 18px 70px #000}}
</style>
</head>
<body><main class="app">
<div id="scene" class="scene"></div><div id="awayveil" class="awayveil"></div><div class="topmask"></div>
<header class="header"><div class="place"><span class="num">01</span>自室</div><div id="clock" class="clock">07:12</div><div id="date" class="date"></div></header>
<div class="bottommask"></div><div id="whisper" class="whisper"></div>
<nav class="nav"><button class="active" data-sheet="none"><span class="ico">◌</span><span class="lab">部屋</span></button><button data-sheet="diary"><span class="ico">□</span><span class="lab">日記</span></button><button data-sheet="record"><span class="ico">≡</span><span class="lab">痕跡</span></button><button data-sheet="settings"><span class="ico">⚙︎</span><span class="lab">設定</span></button></nav>
<div id="sheet" class="sheet"><div class="card"><div class="handle"></div><button class="close" id="close">閉じる</button><div id="sheetBody"></div></div></div>
</main>
<script>
const $=s=>document.querySelector(s);let demo=null,currentState=null;
function hashDate(d){const s=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h>>>0)}
function dayPlan(d){const h=hashDate(d);const weekend=[0,6].includes(d.getDay());const late=(h%5===0)?18:0;const wake=weekend?7.35+(h%35)/100:6.72+(h%22)/100;const leave=weekend?(h%3===0?10.3:8.15):8.02+(h%12)/100;const ret=weekend?(16.8+(h%130)/100):(18.45+(h%95)/100)+(late?0.55:0);const compose=(h%3!==1);return{wake,leave,ret,compose,seed:h}}
function now(){if(!demo)return new Date();const d=new Date();d.setHours(demo.h,demo.m,0,0);return d}
function fmtDate(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]})`}
function stateFor(d){const p=dayPlan(d),t=d.getHours()+d.getMinutes()/60;if(t<p.wake)return{id:'sleep',home:true,note:t<6?'眠っている。':'まだ起きてこない。',cls:t<5.5?'night':''};if(t<p.wake+.28)return{id:'wake',home:true,note:'起きたようだ。',cls:''};if(t<p.leave)return{id:'prep',home:true,note:'支度をしている。',cls:''};if(t<p.ret)return{id:'away',home:false,note:'',cls:''};if(t<21.7)return{id:'return',home:true,note:(p.seed%4===0?'鞄が床に置かれている。':'帰っている。'),cls:'evening'};if(t<23.15&&p.compose)return{id:'compose',home:true,note:'机の明かりだけがついている。',cls:'night',trace:'ヘッドホンが机に出ている'};if(t<23.7)return{id:'late',home:true,note:'部屋は静かだ。',cls:'night'};return{id:'sleep2',home:true,note:'眠っている。',cls:'night'}}
function logObservation(d,s){if(demo)return;const key='og_v04_log';let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch{};const stamp=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;const text=s.home?(s.note||'部屋にいた。'):'部屋に姿はなかった。';if(!arr.length||arr[arr.length-1].stamp!==stamp){arr.push({stamp,text});arr=arr.slice(-40);localStorage.setItem(key,JSON.stringify(arr))}}
function render(){const d=now(),s=stateFor(d);currentState=s;$('#clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;$('#date').textContent=fmtDate(d);$('#scene').className='scene '+(s.cls||'');$('#awayveil').classList.toggle('show',!s.home);$('#whisper').innerHTML=s.note?`${s.note}${s.trace?`<br><span class="trace">${s.trace}</span>`:''}`:'';logObservation(d,s)}
setInterval(render,30000);render();
function diaryHTML(){const d=now(),p=dayPlan(d),t=d.getHours()+d.getMinutes()/60;const available=t>=21.5&&currentState&&currentState.home;if(!available)return `<div class="title">日記</div><div class="emptylog">今は読めるものがない。</div><div class="caption">机の上に開かれている時だけ、中を見ることができる。</div>`;const variants=[`今日はテンポが決まらなかった。<br>でも、帰り道で思いついた四小節だけは残した。`,`授業中に昨日のリズムの続きが浮かんだ。<br>帰ってからアプリで少しだけ形にした。<br><br>まだ誰にも聴かせたくない。`,`パーカッションの入りを変えたら、少しだけ曲が呼吸した。<br>明日もう一度聴く。`];return `<div class="title">日記</div><div class="diary"><div class="d">${d.getMonth()+1}月${d.getDate()}日</div>${variants[p.seed%variants.length]}</div><div class="caption">書かれていることが、すべてとは限らない。</div>`}
function recordHTML(){let arr=[];try{arr=JSON.parse(localStorage.getItem('og_v04_log')||'[]')}catch{};const rows=arr.slice().reverse().map(x=>`<div class="log"><time>${x.stamp.slice(11)}</time>${x.text}</div>`).join('');return `<div class="title">痕跡</div>${rows||'<div class="emptylog">まだ何も残っていない。<br>このページを開いた時に見えたことだけが残る。</div>'}<div class="caption">知らない時間のことは、ここにも残らない。</div>`}
const settingsHTML=`<div class="title">設定 / デモ</div><div class="settings"><button data-time="live">現在時刻に戻す</button><button data-time="7:12">07:12　朝</button><button data-time="8:30">08:30　不在</button><button data-time="16:30">16:30　不在</button><button data-time="19:40">19:40　帰宅後</button><button data-time="22:25">22:25　夜</button></div><div class="tiny">日によって起床・外出・帰宅時刻が少し変わります。</div>`;
function openSheet(type){if(type==='none')return;$('#sheetBody').innerHTML=type==='diary'?diaryHTML():type==='record'?recordHTML():settingsHTML;$('#sheet').classList.add('open');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{if(b.dataset.time==='live')demo=null;else{const[h,m]=b.dataset.time.split(':').map(Number);demo={h,m}}render();$('#sheet').classList.remove('open')})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));$('#close').onclick=()=>$('#sheet').classList.remove('open');$('#sheet').onclick=e=>{if(e.target===$('#sheet'))$('#sheet').classList.remove('open')};
</script></body></html>
